name: Desplegar Unespacio Citas (demo)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run pages:build
      - name: Verificar versión y recursos publicados
        run: |
          grep -q 'name="unespacio-release" content="0.11.0"' dist/index.html
          grep -q 'booking.css?v=0.11.0' dist/index.html
          test -s dist/assets/css/booking.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar URL publicada y crear capturas reales
        run: node scripts/verify-deployed.mjs
      - name: Guardar capturas del sitio desplegado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unespacio-plataforma-web-sitio-real-0.11.0
          path: qa/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
