name: Frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unespacio
          POSTGRES_PASSWORD: unespacio_ci
          POSTGRES_DB: unespacio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U unespacio -d unespacio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://unespacio:unespacio_ci@localhost:5432/unespacio_test
